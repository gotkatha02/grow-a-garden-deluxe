<script>
const V=new URLSearchParams(location.search).get('v')||'all';
const W=window.ROOTS_WEB,NS='http://www.w3.org/2000/svg',S=document.getElementById('S');
const N={};for(const n of W.N)N[n.id]=n;const LIT=new Set(W.lit);const PLV=55,PTS=100,USED=W.pts,SEL='CA1';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e;}
let seed=17;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
function txt(x,y,t,col,size,wt,fam,p,anchor){const e=el('text',{x,y,'text-anchor':anchor||'middle','font-size':size,'font-family':fam||'Prompt','font-weight':wt||500,fill:col},p);e.textContent=t;return e;}
function label(x,y,t,col,size,anchor,stroke){const g=el('g',{});const e=txt(x,y,t,col,size,500,'Prompt',g,anchor);const w=e.getComputedTextLength()+14;const x0=anchor==='start'?x-7:anchor==='end'?x-w+7:x-w/2;
 const r=el('rect',{x:x0,y:y-size-1,width:w,height:size+7,rx:7,fill:'#120a05',opacity:.86,stroke:stroke||'#7a5a30','stroke-width':1.2},g);g.insertBefore(r,e);return g;}
const SC={atk:'#ff6b5a',tal:'#c39bff',vit:'#6fdc7a',def:'#7fb2ff',agi:'#5fe0e6',cha:'#ff9ed0',int:'#8fa8ff',lck:'#ffd75a'};
const SL={atk:'ATK',tal:'TAL',vit:'VIT',def:'DEF',agi:'AGI',cha:'CHA',int:'INT',lck:'LCK'};
const RIM={1:'#c98b4a',2:'#d6dde6',3:'#f3c34e',4:'#7ff5e0'};
const ADJ={};for(const n of W.N)ADJ[n.id]=new Set();
for(const [a,b,t] of W.E){if(t==='spoke'){ADJ[b].add(a);continue;}ADJ[a].add(b);ADJ[b].add(a);}
const nLit=W.lit.length-1;
function avail(id){const n=N[id];if(LIT.has(id)||n.k==='h')return false;if(PLV<(n.lv||1))return false;
 let ok=false;for(const j of LIT)if(ADJ[j].has(id)&&!(N[j].knot)){ok=true;break;}if(!ok)return false;
 if(n.k==='c'){if(n.knot.filter(j=>LIT.has(j)).length<3)return false;if(nLit<n.need)return false;}return true;}
// ---- view
let k,cx,cy,sx,sy;
if(V==='zoom'){k=1.0;cx=-560;cy=0;sx=622;sy=470;}else{k=.338;cx=0;cy=0;sx=622;sy=474;}
const X=x=>(x-cx)*k+sx,Y=y=>(y-cy)*k+sy;
const big=V==='zoom';
async function build(){
await Promise.all(['500 13px Prompt','400 13px Prompt','600 28px Mitr','600 12px Mitr'].map(f=>document.fonts.load(f)));
const defs=el('defs',{});
defs.innerHTML=`
<radialGradient id="earth" cx="${X(0)/16}%" cy="${Y(0)/9}%" r="${W.RX*k*1.15/16}%" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#4a301c"/><stop offset=".35" stop-color="#2c1a0e"/><stop offset=".7" stop-color="#160c08"/><stop offset="1" stop-color="#070510"/></radialGradient>
<radialGradient id="stone" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#bdb3a0"/><stop offset=".6" stop-color="#7c7466"/><stop offset="1" stop-color="#4b453c"/></radialGradient>
<radialGradient id="stone2" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#6e5c49"/><stop offset="1" stop-color="#241a12"/></radialGradient>
<radialGradient id="heart" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#fff7cf"/><stop offset=".4" stop-color="#ffd25a"/><stop offset=".8" stop-color="#c8701a"/><stop offset="1" stop-color="#6a3208"/></radialGradient>
<linearGradient id="br" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc760"/><stop offset="1" stop-color="#c0581a"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${big?5:2.5}"/></filter>
<filter id="glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${big?10:5}"/></filter>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="dim"><feColorMatrix type="saturate" values="0.15"/><feComponentTransfer><feFuncR type="linear" slope=".5"/><feFuncG type="linear" slope=".5"/><feFuncB type="linear" slope=".55"/></feComponentTransfer></filter>
<filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .34  0 0 0 0 .22  0 0 0 0 .12  0 0 0 1.5 -.66"/></filter>`;
// ---------- background: warm soil round the heart, darker and crystal-filled toward the rim
el('rect',{x:0,y:0,width:1600,height:900,fill:'#070510'});
el('ellipse',{cx:X(0),cy:Y(0),rx:W.RX*1.25*k,ry:W.RY*1.25*k,fill:'url(#earth)'});
el('rect',{x:0,y:0,width:1600,height:900,filter:'url(#noise)',opacity:.5});
const RHO=[[.30,1],[.52,2],[.76,3]];
// band 4 crystals (outside ρ .76) + band 3 gold specks
for(let i=0;i<(big?60:220);i++){const a=rnd()*Math.PI*2,r=.5+rnd()*.55,wx=Math.cos(a)*W.RX*r,wy=Math.sin(a)*W.RY*r,x=X(wx),y=Y(wy);if(x<0||x>1232||y<0||y>900)continue;
 const s=(big?7:3)+rnd()*(big?8:4),deep=r>.76;el('polygon',{points:`${x},${y-s*1.6} ${x+s*.6},${y} ${x},${y+s*.5} ${x-s*.6},${y}`,fill:deep?'#7ff5e0':'#ffd77a',opacity:(deep?.14:.08)+rnd()*.1});}
for(const [r,b] of RHO){el('ellipse',{cx:X(0),cy:Y(0),rx:W.RX*r*k,ry:W.RY*r*k,fill:'none',stroke:RIM[b+1],'stroke-width':big?2:1.6,'stroke-dasharray':big?'4 10':'3 7',opacity:.45});}
// faint rootlets (decor)
for(const [a,b,t] of W.E){if(t!=='root'||rnd()<.6)continue;const A=N[a],B=N[b],tt=.3+rnd()*.4,x=X(A.x+(B.x-A.x)*tt),y=Y(A.y+(B.y-A.y)*tt),an=rnd()*Math.PI*2,l=(16+rnd()*36)*k*1.4;
 el('path',{d:`M ${x} ${y} q ${Math.cos(an)*l*.5+(rnd()-.5)*8} ${Math.sin(an)*l*.5+(rnd()-.5)*8} ${Math.cos(an)*l} ${Math.sin(an)*l}`,stroke:'#3b2213','stroke-width':Math.max(1,2.6*k),fill:'none','stroke-linecap':'round',opacity:.8});}
// ---------- edges
const WID={root:10,ring:6,spoke:2};
const curve=(A,B,t)=>{const x1=X(A.x),y1=Y(A.y),x2=X(B.x),y2=Y(B.y);if(t!=='root')return `M ${x1} ${y1} L ${x2} ${y2}`;
 const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,o=(rnd()-.5)*.25*L;return `M ${x1} ${y1} Q ${mx-dy/L*o} ${my+dx/L*o} ${x2} ${y2}`;};
const ED=W.E.map(([a,b,t])=>({a,b,t,d:curve(N[a],N[b],t),lit:LIT.has(a)&&LIT.has(b)}));
for(const e of ED)if(e.t==='spoke')el('path',{d:e.d,stroke:e.lit?'#ffe08a':'#8a6a4a','stroke-width':Math.max(.8,WID.spoke*k),fill:'none','stroke-dasharray':`${4*k} ${5*k}`,opacity:e.lit?.9:.4});
for(const e of ED)if(e.t!=='spoke')el('path',{d:e.d,stroke:'#170c05','stroke-width':(WID[e.t]+5)*k,fill:'none','stroke-linecap':'round'});
for(const e of ED)if(e.t!=='spoke')el('path',{d:e.d,stroke:e.t==='ring'?'#6b4a2c':'#5f3c22','stroke-width':WID[e.t]*k,fill:'none','stroke-linecap':'round'});
if(big)for(const e of ED)if(e.t!=='spoke')el('path',{d:e.d,stroke:'#93643b','stroke-width':Math.max(1,WID[e.t]*k*.3),fill:'none','stroke-linecap':'round',transform:`translate(${-1*k},${-2*k})`,opacity:.7});
for(const e of ED)if(e.lit&&e.t!=='spoke'){el('path',{d:e.d,stroke:'#ffcf5a','stroke-width':(WID[e.t]+12)*k,fill:'none',opacity:.35,filter:'url(#glow)','stroke-linecap':'round'});
 el('path',{d:e.d,stroke:'#ffd977','stroke-width':Math.max(1.4,4*k),fill:'none','stroke-linecap':'round'});}
 else if(big&&e.t!=='spoke'&&((LIT.has(e.a)&&avail(e.b))||(LIT.has(e.b)&&avail(e.a))))el('path',{d:e.d,stroke:'#ffe58a','stroke-width':2.4*k,fill:'none','stroke-dasharray':`${6*k} ${6*k}`,opacity:.85});
// ---------- nodes (labels go in a last pass so nothing covers them)
const LBL=[];
for(const n of W.N){const x=X(n.x),y=Y(n.y),lit=LIT.has(n.id),av=avail(n.id);if(x<-60||x>1300||y<-60||y>960)continue;
 if(n.k==='h'){const r=30*k*(big?1:1.8);el('circle',{cx:x,cy:y,r:r*2,fill:'#ffcf5a',opacity:.5,filter:'url(#glow2)'});
  const cp=el('clipPath',{id:'cph'},defs);el('circle',{cx:x,cy:y,r:r},cp);el('circle',{cx:x,cy:y,r:r,fill:'url(#heart)'});
  el('image',{href:'faces/bear_s.png',x:x-r*1.25,y:y-r*.55,width:r*2.5,height:r*1.1,'clip-path':'url(#cph)',preserveAspectRatio:'xMidYMid slice',opacity:.9});
  el('circle',{cx:x,cy:y,r:r,fill:'none',stroke:'#ffe27a','stroke-width':big?4:2.5});el('circle',{cx:x,cy:y,r:r*1.22,fill:'none',stroke:'#e9b44c','stroke-width':big?2:1.4,'stroke-dasharray':'3 4'});
  LBL.push(()=>label(x,y+r*1.22+(big?20:14),'หัวใจราก (จุดเริ่ม)','#ffe3a0',big?13:10.5));continue;}
 if(n.k==='m'){const r=(big?13:15)*k,c=SC[n.st];
  if(lit)el('circle',{cx:x,cy:y,r:r*1.8,fill:c,opacity:.38,filter:'url(#glow)'});
  el('circle',{cx:x,cy:y,r,fill:lit?c:'url(#stone2)',stroke:'#120a05','stroke-width':Math.max(1,2.5*k)});
  if(!lit)el('circle',{cx:x,cy:y,r:r*.72,fill:'none',stroke:c,'stroke-width':Math.max(.9,2.2*k),opacity:.6});
  el('circle',{cx:x,cy:y,r:r+Math.max(.8,1.6*k),fill:'none',stroke:RIM[n.band],'stroke-width':Math.max(.8,1.8*k),opacity:lit?.95:.5});
  if(big)txt(x,y+3.5,SL[n.st],lit?'#1a0a04':'#cdb896',9.5,600,'Mitr');
  if(av&&big)el('circle',{cx:x,cy:y,r:r*1.65,fill:'none',stroke:'#ffe58a','stroke-width':2*k,'stroke-dasharray':`${4*k} ${3*k}`});continue;}
 if(n.k==='n'||n.k==='b'){const r=21*k*(big?1:1.15);
  if(lit)el('circle',{cx:x,cy:y,r:r*1.7,fill:n.k==='b'?'#ffb347':SC[n.st],opacity:.4,filter:'url(#glow)'});
  let pts=[];if(n.k==='b')pts=[[0,-1.15],[1.15,0],[0,1.15],[-1.15,0]];else for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;pts.push([Math.cos(a),Math.sin(a)]);}
  const P=s=>pts.map(([a,b])=>`${x+a*r*s},${y+b*r*s}`).join(' ');
  el('polygon',{points:P(1),fill:n.k==='b'?(lit?'url(#br)':'#8a5a2a'):(lit?SC[n.st]:'#3a2a1c'),stroke:'#120a05','stroke-width':Math.max(1.2,3*k)});
  el('polygon',{points:P(.68),fill:'none',stroke:n.k==='b'?'#ffd9a0':SC[n.st],'stroke-width':Math.max(.9,1.6*k),opacity:.8});
  el('polygon',{points:P(1.14),fill:'none',stroke:RIM[n.band],'stroke-width':Math.max(.9,1.6*k),opacity:lit?.95:.55});
  if(big){if(n.k==='b'){txt(x,y+4.5,n.col==='A'?'A':n.col==='B'?'B':'พฐ',lit?'#3a1606':'#ffe9c8',n.col==='basic'?10:13,600,'Mitr');LBL.push(()=>label(x+r+10,y+5,n.txt,'#ffe3a0',11.5,'start'));}
   else txt(x,y+4.5,'+3','#fff3c8',12,600,'Mitr');}
  continue;}
 // C skill knot centre
 const r=36*k*(big?1:1.12),sel=n.id===SEL&&big,lk=PLV<n.lv;
 if(lit)el('circle',{cx:x,cy:y,r:r*1.55,fill:'#ffcf5a',opacity:.42,filter:'url(#glow2)'});
 el('circle',{cx:x,cy:y,r:r*1.5,fill:'#ffd77a',opacity:big?.12:.22,filter:'url(#glow2)'});
 el('circle',{cx:x,cy:y,r:r*1.22,fill:'url(#stone)',stroke:'#170c05','stroke-width':Math.max(1.2,3*k)});
 const cp=el('clipPath',{id:'cp_'+n.id},defs);el('circle',{cx:x,cy:y,r},cp);
 el('circle',{cx:x,cy:y,r:r+1,fill:'#1a120c'});
 const im=el('image',{href:`../../assets/icons/wolf/${n.sk}.webp`,x:x-r*1.32,y:y-r*1.32,width:r*2.64,height:r*2.64,'clip-path':`url(#cp_${n.id})`,preserveAspectRatio:'xMidYMid slice'});
 if(!lit&&!sel&&big)im.setAttribute('filter','url(#dim)');
 el('circle',{cx:x,cy:y,r,fill:'none',stroke:lit?'#f6c64e':RIM[n.band],'stroke-width':Math.max(1.6,(lit?4.5:3)*k)});
 if(sel){el('circle',{cx:x,cy:y,r:r*1.45,fill:'none',stroke:'#ffe27a','stroke-width':9*k,opacity:.55,filter:'url(#glow)'});el('circle',{cx:x,cy:y,r:r*1.42,fill:'none',stroke:'#fff3b8','stroke-width':3*k,'stroke-dasharray':`${10*k} ${6*k}`});}
 if(big){LBL.push(()=>label(x,y+r+16,n.nm,'#fff3c8',12.5));const on=n.knot.filter(j=>LIT.has(j)).length;
  if(!lit){const g=el('g',{});el('rect',{x:x+r*.8,y:y-r*1.35,width:54,height:20,rx:10,fill:on>=3?'#3a5a10':'#5a1a10',stroke:on>=3?'#bff0a8':'#ff9a7a','stroke-width':1.5},g);txt(x+r*.8+27,y-r*1.35+15,`ปม ${on}/6`,on>=3?'#e8ffd8':'#ffe0d0',11,600,'Mitr',g);}}
 else{const tierTxt=['','ขั้น 1','ขั้น 2','ขั้น 3','ขั้น 4'][n.tier];LBL.push(()=>label(x,y+(72+18)*k+9,`${n.nm} · ${tierTxt}`,'#fff3c8',10.5,'middle',RIM[n.band]));}
}

if(!big){const c=N.CA1,x=X(c.x),y=Y(c.y),g=el('g',{});
 el('path',{d:`M ${x-14} ${y+22} Q ${x-40} ${y+60} ${x-70} ${y+84}`,stroke:'#ffe27a','stroke-width':2,fill:'none','stroke-dasharray':'5 4'},g);
 el('rect',{x:x-250,y:y+84,width:236,height:52,rx:12,fill:'#1a0e07',opacity:.94,stroke:'#ffd25a','stroke-width':2},g);

 // depth tags sit on the ring lines (where one band ends and the next begins)
 const TAGS=[[.30,2,'ชั้น 2 · Lv 41+'],[.52,3,'ชั้น 3 · Lv 51+'],[.76,4,'ชั้น 4 · Lv 54+']],a=320*Math.PI/180;
 for(const [r,b,t] of TAGS)label(X(Math.cos(a)*W.RX*r),Y(Math.sin(a)*W.RY*r)+5,t,RIM[b],11,'middle',RIM[b]);
 label(X(Math.cos(a)*W.RX*.15),Y(Math.sin(a)*W.RY*.15)+5,'ชั้น 1 · Lv 31+',RIM[1],11,'middle',RIM[1]);}
// ---------- panels
document.getElementById('sub').textContent=`หมาป่า · Lv ${PLV} · ทั้งต้น ${W.N.length-1} โหนด · จุดแล้ว ${nLit} ดวง`;
document.getElementById('chips').innerHTML=`<span class="chip g">แต้มราก เหลือ ${PTS-USED}/${PTS}</span><span class="chip">ยางวิญญาณ 260</span><span class="chip">เหรียญโทเท็มทอง 1</span><span class="chip">แก่น 0</span>`;
const side=document.getElementById('side');const dot=c=>`<i class="dot" style="background:${c}"></i>`;
